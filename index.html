<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>MbappeMessenger 🐢</title>
    <!-- Подключение Firebase v8 -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

    <style>
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body, html { margin: 0; padding: 0; height: 100%; font-family: "Segoe UI", Roboto, Helvetica, Arial, sans-serif; background: #0b0e14; color: #fff; overflow: hidden; }
        
        :root {
            --primary: #D4AF37;
            --primary-dark: #b5952f;
            --bg-dark: #0b0e14;
            --header-bg: #0A1C56;
            --msg-bg: #161b22;
            --text-light: #e6edf3;
        }

        #reg-screen { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 1000; background: radial-gradient(circle at center, #1a2a6c, #112 80%); display: none; }
        .reg-container { width: 100%; max-width: 320px; margin: 100px auto; text-align: center; padding: 25px; background: rgba(0,0,0,0.5); border-radius: 15px; border: 1px solid var(--primary); box-shadow: 0 0 20px rgba(212, 175, 55, 0.2); }
        
        input[type="text"] { width: 100%; border: 2px solid #30363d; border-radius: 8px; padding: 12px; font-size: 16px; outline: none; background: #010409; color: #fff; margin-bottom: 15px; transition: border 0.3s; }
        input[type="text"]:focus { border-color: var(--primary); }
        
        button { width: 100%; background: var(--primary); color: #000; border: none; border-radius: 8px; padding: 14px; font-size: 16px; font-weight: bold; cursor: pointer; text-transform: uppercase; letter-spacing: 1px; transition: transform 0.1s, background 0.3s; }
        button:active { background: var(--primary-dark); transform: scale(0.98); }

        #header { height: 60px; line-height: 60px; background: var(--header-bg); border-bottom: 2px solid var(--primary); color: #fff; font-size: 22px; font-weight: bold; padding: 0 20px; position: absolute; top: 0; width: 100%; box-shadow: 0 4px 10px rgba(0,0,0,0.5); z-index: 100; display: flex; justify-content: space-between; align-items: center; }
        #header-title { flex-grow: 1; text-shadow: 0 2px 4px rgba(0,0,0,0.5); }
        #settings-btn { background: none; border: none; color: var(--primary); font-size: 28px; cursor: pointer; padding: 0 10px; width: auto; height: auto; }
        
        #chat-container { position: absolute; top: 60px; bottom: 65px; width: 100%; overflow-y: auto; padding: 15px 0; -webkit-overflow-scrolling: touch; background: var(--bg-dark); }
        .msg { padding: 12px 20px; display: table; width: 100%; border-bottom: 1px solid rgba(255,255,255,0.05); }
        
        .avatar { width: 46px; height: 46px; line-height: 46px; text-align: center; color: #fff; font-size: 20px; font-weight: bold; display: table-cell; vertical-align: middle; text-transform: uppercase; border-radius: 50%; border: 2px solid rgba(255,255,255,0.1); box-shadow: 0 2px 5px rgba(0,0,0,0.5); }
        
        .msg-body { display: table-cell; vertical-align: top; padding-left: 15px; }
        .nick-os-wrap { display: flex; align-items: center; margin-bottom: 4px; }
        .nick { font-weight: bold; font-size: 14px; color: var(--primary); margin-right: 6px; }
        .os-icon { width: 14px; height: 14px; vertical-align: middle; opacity: 0.7; }
        .text { font-size: 15px; line-height: 1.5; color: var(--text-light); word-break: break-word; }

        #footer { position: absolute; bottom: 0; width: 100%; height: 65px; background: #161b22; border-top: 1px solid #30363d; display: flex; align-items: center; padding: 0 10px; }
        #input-wrap { flex-grow: 1; padding-right: 10px; }
        #msg-input { width: 100%; border: 1px solid #30363d; border-radius: 20px; padding: 12px 18px; font-size: 16px; background: #010409; color: #fff; outline: none; transition: border 0.3s; }
        #msg-input:focus { border-color: var(--primary); }
        #btn-wrap { width: 90px; }
        #send-btn { border-radius: 20px; padding: 12px 0; font-size: 14px; }

        .popup { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); z-index: 2000; justify-content: center; align-items: center; backdrop-filter: blur(5px); }
        .popup-content { background: #161b22; padding: 25px; border-radius: 12px; border: 1px solid #30363d; box-shadow: 0 10px 30px rgba(0,0,0,0.8); width: 90%; max-width: 400px; text-align: center; }
        .popup-content h2, .popup-content h3 { margin-top: 0; color: var(--primary); }
        .popup-content label { display: block; margin-top: 15px; margin-bottom: 8px; color: #8b949e; font-size: 14px; text-align: left; }
        
        input[type="color"] { width: 100%; height: 45px; padding: 0; border: none; cursor: pointer; border-radius: 8px; overflow: hidden; background: none; }
        
        .btn-group { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 15px; }
        .btn-group button { flex: 1; min-width: 120px; margin: 0; }
        .btn-close, .btn-cancel { background: #30363d; color: #fff; }
        .btn-close:active, .btn-cancel:active { background: #21262d; }
        .btn-delete { background: #da3633; color: #fff; }
        .btn-delete:active { background: #b62324; }
    </style>
</head>
<body>
    <div id="reg-screen">
        <div class="reg-container">
            <h1 style="color:var(--primary); font-size: 42px; margin: 0 0 5px 0; text-transform: italic;">MBAPPE</h1>
            <h2 style="color:#fff; font-size: 20px; margin-bottom: 25px; font-weight: normal; letter-spacing: 2px;">MESSENGER 🐢</h2>
            <p style="margin-bottom: 15px; color: #8b949e; font-size: 14px;">Введите позывной на поле (латиница/цифры)</p>
            <input type="text" id="nick-input" placeholder="Ваш никнейм..." maxlength="15">
            <button id="join-btn">Выйти на поле ⚽</button>
        </div>
    </div>

    <div id="main-screen">
        <div id="header">
            <span id="header-title">MbappeMessenger 🐢</span>
            <button id="settings-btn">&#9881;</button>
        </div>
        <div id="chat-container"></div>
        <div id="footer">
            <div id="input-wrap">
                <input type="text" id="msg-input" placeholder="Дать пас (сообщение)..." autocomplete="off">
            </div>
            <div id="btn-wrap">
                <button id="send-btn">ПАС ⚽</button>
            </div>
        </div>
    </div>

    <!-- Настройки -->
    <div id="settings-popup" class="popup">
        <div class="popup-content">
            <h2>Раздевалка (Настройки)</h2>
            <label for="new-nick-input">Сменить номер (Никнейм):</label>
            <input type="text" id="new-nick-input" placeholder="Новый ник..." maxlength="15">
            <button id="change-nick-btn">Сменить</button>

            <label for="avatar-color-picker">Цвет формы (Аватар):</label>
            <input type="color" id="avatar-color-picker">
            <button id="save-color-btn" style="margin-top: 10px;">Сохранить форму</button>

            <div class="btn-group">
                <button id="delete-account-btn" class="btn-delete">Уйти из клуба</button>
                <button id="close-settings-btn" class="btn-close">Закрыть</button>
            </div>
        </div>
    </div>

    <!-- Подтверждение -->
    <div id="confirm-popup" class="popup">
        <div class="popup-content">
            <h3 id="confirm-title">VAR: Подтверждение</h3>
            <p id="confirm-message" style="color:#c9d1d9; line-height: 1.5; margin-bottom: 20px;">Вы уверены?</p>
            <div class="btn-group">
                <button id="confirm-yes-btn">Да</button>
                <button id="confirm-no-btn" class="btn-cancel">Отмена</button>
            </div>
        </div>
    </div>

    <script>
        var firebaseConfig = {
            apiKey: "AIzaSyAh2y6xXfjpMUeGc-YpRHG1jcp4RNhdfNE",
            authDomain: "bingo--messenger.firebaseapp.com",
            databaseURL: "https://bingo--messenger-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "bingo--messenger",
            storageBucket: "bingo--messenger.firebasestorage.app",
            messagingSenderId: "1036558754530",
            appId: "1:1036558754530:web:47577c4ac6d077cc3434bb",
            measurementId: "G-2KPX0PBH0P"
        };
        firebase.initializeApp(firebaseConfig);
        var db = firebase.database();

        var myNick = null;
        var myAvatarColor = '#D4AF37'; 
        var isInitialLoad = true; // Для предотвращения уведомлений при первой загрузке истории

        try {
            myNick = localStorage.getItem('mbappe_nick');
            myAvatarColor = localStorage.getItem('mbappe_avatar_color') || '#D4AF37'; 
        } catch (e) { console.warn("Storage not available."); }

        var currentConfirmAction = null;
        var osInfo = getOS();

        var osIcons = {
            'Android': 'https://cdn-icons-png.flaticon.com/128/174/174836.png',
            'iOS': 'https://cdn-icons-png.flaticon.com/128/0/747.png',
            'Mac OS': 'https://cdn-icons-png.flaticon.com/128/0/747.png',
            'Windows': 'https://cdn-icons-png.flaticon.com/128/732/732076.png',
            'Linux': 'https://cdn-icons-png.flaticon.com/128/13/13702.png',
            'Other': ''
        };

        // Запрос разрешения на отправку уведомлений
        function requestNotificationPermission() {
            if ("Notification" in window && Notification.permission !== "granted" && Notification.permission !== "denied") {
                Notification.requestPermission();
            }
        }

        // Функция отправки уведомления
        function sendNotification(author, text) {
            if ("Notification" in window && Notification.permission === "granted") {
                new Notification("MbappeMessenger: " + author, {
                    body: text,
                    icon: "https://cdn-icons-png.flaticon.com/128/33/33736.png" // Иконка мяча
                });
            }
        }

        function getOS() {
            var ua = navigator.userAgent;
            if (/android/i.test(ua)) return "Android";
            if (/iPad|iPhone|iPod/.test(ua)) return "iOS";
            if (/Mac/i.test(ua)) return "Mac OS";
            if (/Windows/i.test(ua)) return "Windows";
            if (/Linux/i.test(ua)) return "Linux";
            return "Other";
        }

        if (!myNick) {
            document.getElementById('reg-screen').style.display = 'block';
        } else {
            document.getElementById('new-nick-input').value = myNick;
            document.getElementById('avatar-color-picker').value = myAvatarColor;
            requestNotificationPermission();
        }

        function getAvColor(nick) {
            if (nick === myNick && myAvatarColor) return 'background:' + myAvatarColor;
            var sum = 0;
            for (var i = 0; i < nick.length; i++) sum += nick.charCodeAt(i);
            var defaultColors = ['#0A1C56', '#D4AF37', '#E53935', '#004D40', '#1565C0', '#6A1B9A', '#E65100', '#2E7D32'];
            return 'background:' + defaultColors[sum % defaultColors.length];
        }

        function sanitize(input) {
            var div = document.createElement('div');
            div.appendChild(document.createTextNode(input));
            return div.innerHTML;
        }

        document.getElementById('join-btn').onclick = function() {
            var nick = document.getElementById('nick-input').value.replace(/[^a-zA-Z0-9]/g, "").toLowerCase();
            if (nick.length < 3 || nick.length > 15) { 
                alert("Никнейм должен быть от 3 до 15 символов!");
                return; 
            }

            var userRef = db.ref('users/' + nick);
            userRef.once('value', function(snapshot) {
                if (snapshot.exists()) {
                    alert("Этот никнейм уже занят!");
                } else {
                    userRef.set({ reg: true, color: '#D4AF37' }, function(error) {
                        if (error) {
                            alert("Ошибка БД: " + error.message);
                        } else {
                            try {
                                localStorage.setItem('mbappe_nick', nick);
                                localStorage.setItem('mbappe_avatar_color', '#D4AF37'); 
                            } catch(e) {}
                            requestNotificationPermission();
                            location.reload();
                        }
                    });
                }
            });
        };

        function sendMessage() {
            var text = document.getElementById('msg-input').value;
            if (!text.trim() || !myNick) return;

            var sanitizedText = sanitize(text);

            db.ref('messages').push({
                nick: myNick,
                text: sanitizedText,
                time: Date.now(),
                color: myAvatarColor,
                os: osInfo 
            }).catch(function(error) {
                alert("Ошибка отправки: " + error.message);
            });
            document.getElementById('msg-input').value = "";
        }

        document.getElementById('send-btn').onclick = sendMessage;
        document.getElementById('msg-input').onkeypress = function(e) {
            if (e.keyCode == 13) { e.preventDefault(); sendMessage(); }
        };

        // Чтение сообщений из Firebase
        db.ref('messages').limitToLast(50).on('child_added', function(snap) {
            var m = snap.val();
            if (!m) return;
            m.os = m.os || 'Other'; 

            var chat = document.getElementById('chat-container');
            var msgDiv = document.createElement('div');
            msgDiv.className = 'msg';
            
            var avatarColor = m.nick === myNick ? myAvatarColor : (m.color || getAvColor(m.nick).replace('background:', ''));
            var avatarStyle = 'background:' + avatarColor;
            
            var sNick = sanitize(m.nick);
            var sText = sanitize(m.text);

            var osIconSrc = osIcons[m.os] || osIcons['Other'];
            var osIconHtml = osIconSrc ? `<img src="${osIconSrc}" class="os-icon" alt="${m.os} icon">` : '';
            
            msgDiv.innerHTML = '<div class="avatar" style="' + avatarStyle + '">' + sNick.charAt(0) + '</div>' +
                               '<div class="msg-body">' +
                               '<div class="nick-os-wrap">' +
                               '<div class="nick">' + sNick + '</div>' + osIconHtml +
                               '</div>' +
                               '<div class="text">' + sText + '</div>' +
                               '</div>';
            chat.appendChild(msgDiv);
            chat.scrollTop = chat.scrollHeight;

            // Логика отправки системного уведомления
            if (!isInitialLoad && m.nick !== myNick) {
                sendNotification(m.nick, m.text);
            }
        });

        // После загрузки первых старых сообщений включаем отслеживание новых
        db.ref('messages').limitToLast(1).once('value', function() {
            setTimeout(function() {
                isInitialLoad = false;
            }, 1000);
        });

        // Настройки
        document.getElementById('settings-btn').onclick = function() {
            document.getElementById('settings-popup').style.display = 'flex';
        };

        document.getElementById('close-settings-btn').onclick = function() {
            document.getElementById('settings-popup').style.display = 'none';
        };

        document.getElementById('save-color-btn').onclick = function() {
            var newColor = document.getElementById('avatar-color-picker').value;
            try { localStorage.setItem('mbappe_avatar_color', newColor); } catch(e) {}
            myAvatarColor = newColor;

            var myAvs = document.querySelectorAll('.msg .avatar');
            for (var i = 0; i < myAvs.length; i++) {
                if (sanitize(myAvs[i].textContent.toLowerCase()) === myNick.charAt(0).toLowerCase()) {
                    myAvs[i].style.background = newColor;
                }
            }
            alert('Форма обновлена!');
            document.getElementById('settings-popup').style.display = 'none';
        };
        
        document.getElementById('change-nick-btn').onclick = function() {
            var newNick = document.getElementById('new-nick-input').value.replace(/[^a-zA-Z0-9]/g, "").toLowerCase();
            if (newNick.length < 3 || newNick.length > 15) return alert("От 3 до 15 символов!");
            if (newNick === myNick) return alert("Это уже твой ник!");

            db.ref('users/' + newNick).once('value', function(snapshot) {
                if (snapshot.exists()) {
                    alert("Ник занят!");
                } else {
                    showConfirm("Смена ника", "Изменить '" + myNick + "' на '" + newNick + "'?", function() {
                        db.ref('users/' + myNick).remove()
                            .then(() => db.ref('users/' + newNick).set({ reg: true, color: myAvatarColor }))
                            .then(() => {
                                try { localStorage.setItem('mbappe_nick', newNick); } catch(e) {}
                                location.reload(); 
                            }).catch(err => alert("Ошибка: " + err.message));
                    });
                }
            });
        };

        document.getElementById('delete-account-btn').onclick = function() {
            showConfirm("Уход из клуба", "Навсегда удалить аккаунт?", function() {
                showConfirm("VAR", "Точно удалить '" + myNick + "'? Сообщения останутся.", function() {
                    db.ref('users/' + myNick).remove().then(() => {
                        try { localStorage.removeItem('mbappe_nick'); localStorage.removeItem('mbappe_avatar_color'); } catch(e) {}
                        location.reload(); 
                    });
                });
            });
        };

        function showConfirm(title, message, onConfirm) {
            document.getElementById('confirm-title').textContent = title;
            document.getElementById('confirm-message').textContent = message;
            document.getElementById('confirm-popup').style.display = 'flex';
            currentConfirmAction = onConfirm;
        }

        document.getElementById('confirm-yes-btn').onclick = function() {
            document.getElementById('confirm-popup').style.display = 'none';
            if (currentConfirmAction) currentConfirmAction();
            currentConfirmAction = null;
        };
        
        document.getElementById('confirm-no-btn').onclick = function() {
            document.getElementById('confirm-popup').style.display = 'none';
            currentConfirmAction = null;
        };
    </script>
</body>
</html>
